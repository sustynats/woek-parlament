name: Deploy verified Parliament snapshot

on:
  schedule:
    - cron: "10 7,17 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      asset_id:
        description: GitHub Release asset ID in this repository (tar.gz)
        required: true
        type: string
      archive_sha256:
        description: SHA-256 of the locally verified public archive
        required: true
        type: string
      source_commit:
        description: Full commit SHA in wirkungsoekonomie-produktiv
        required: true
        type: string
      source_fingerprint:
        description: Static release trigger fingerprint for the exact source commit
        required: true
        type: string
      previous_fingerprint:
        description: Fingerprint currently served by Parliament Pages
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  legacy-watch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check the frozen legacy source without publishing it
        env:
          LEGACY_FINGERPRINT: 2a46bbafa5e6906a2855e7e70b34935ad13cb7ced21e83a64bc0678c6795a726
          LEGACY_COMMIT: 4227bca20b7c2bd0500e0ec1206710595d996966
        run: |
          set -euo pipefail
          live="$(curl -fsSL --max-time 25 https://parlament.wirkungsoekonomie.de/_woek-build-manifest.json)"
          live_fingerprint="$(jq -er '.source_fingerprint | select(test("^[a-f0-9]{64}$"))' <<< "$live")"
          live_commit="$(jq -er '.source_commit | select(test("^[a-f0-9]{40}$"))' <<< "$live")"
          if [[ "$live_fingerprint" != "$LEGACY_FINGERPRINT" ]]; then
            echo "Pages is serving a different verified release. Legacy publication is locked."
            exit 0
          fi
          test "$live_commit" = "$LEGACY_COMMIT"
          trigger="$(curl -fsSL --max-time 25 https://raw.githubusercontent.com/sustynats/wirkungsoekonomie.de/main/.github/static-release-trigger.json)"
          test "$(jq -er '.fingerprint' <<< "$trigger")" = "$LEGACY_FINGERPRINT"
          echo "Pages is serving the frozen legacy release. The next release requires a verified asset."

  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the trusted publishing branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the current publication boundary
        env:
          EXPECTED_PREVIOUS_FINGERPRINT: ${{ inputs.previous_fingerprint }}
        run: |
          set -euo pipefail
          live="$(curl -fsSL --max-time 25 https://parlament.wirkungsoekonomie.de/_woek-build-manifest.json)"
          test "$(jq -er '.source_fingerprint | select(test("^[a-f0-9]{64}$"))' <<< "$live")" = "$EXPECTED_PREVIOUS_FINGERPRINT"
      - name: Download the identified release asset and verify the digest
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.asset_id }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          set -euo pipefail
          [[ "$ASSET_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          endpoint="repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          gh api "$endpoint" | jq -e             --arg id "$ASSET_ID" --arg digest "sha256:$ARCHIVE_SHA256"             '(.id | tostring) == $id and .state == "uploaded" and .digest == $digest and (.name | endswith(".tar.gz"))' > /dev/null
          gh api -H 'Accept: application/octet-stream' "$endpoint" > "$RUNNER_TEMP/parliament.tar.gz"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/parliament.tar.gz" | sha256sum --check --strict
      - name: Prepare static Pages output
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_FINGERPRINT: ${{ inputs.source_fingerprint }}
        run: |
          python3 .github/scripts/verify-release.py "$RUNNER_TEMP/parliament.tar.gz" "$RUNNER_TEMP/pages" "$SOURCE_COMMIT" "$SOURCE_FINGERPRINT"
      - name: Upload the verified static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages
          retention-days: 1

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify the live release immediately before replacing it
        env:
          EXPECTED_PREVIOUS_FINGERPRINT: ${{ inputs.previous_fingerprint }}
        run: |
          set -euo pipefail
          live="$(curl -fsSL --max-time 25 https://parlament.wirkungsoekonomie.de/_woek-build-manifest.json)"
          test "$(jq -er '.source_fingerprint | select(test("^[a-f0-9]{64}$"))' <<< "$live")" = "$EXPECTED_PREVIOUS_FINGERPRINT"
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify that Pages serves the selected release
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_FINGERPRINT: ${{ inputs.source_fingerprint }}
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://parlament.wirkungsoekonomie.de/_woek-build-manifest.json?check=$GITHUB_RUN_ID-$attempt" |
              jq -e --arg commit "$SOURCE_COMMIT" --arg fingerprint "$SOURCE_FINGERPRINT"                 '.source_commit == $commit and .source_fingerprint == $fingerprint' > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "The live manifest has not confirmed the selected release." >&2
          exit 1
